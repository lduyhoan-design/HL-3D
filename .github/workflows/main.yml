name: Kiểm tra & build

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Lấy mã nguồn
              uses: actions/checkout@v4

            - name: Cài Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Cài thư viện
              run: npm install

            - name: Kiểm tra lỗi code (TypeScript)
              run: npx tsc --noEmit -p .

            - name: Build app
              run: npx rspack build

            # Bộ test gốc của Chili3D còn kiểm tra giao diện tiếng Anh, nên chỉ chạy để tham khảo, không chặn.
            - name: Chạy unit test (tham khảo)
              continue-on-error: true
              run: npm run test
